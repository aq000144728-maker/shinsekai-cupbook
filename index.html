<script>const API='https://jwhedwppqtfqiettexki.supabase.co/functions/v1';let selectedCustomer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function maskPhone(p){p=String(p||'');return p.length>=6?p.slice(0,6)+'xxxx':p}function displayName(n){n=String(n||'').trim();return n?n[0]+'先生/小姐':'顧客'}async function post(path,body,extra={}){const r=await fetch(API+'/'+path,{method:'POST',headers:{'Content-Type':'application/json',...extra},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'操作失敗');e.status=r.status;throw e}return d}async function loadHome(){try{const d=await post('cupbook-public',{action:'home'}),top=(d.top||[]).slice(0,5),el=document.getElementById('rankList');el.innerHTML=top.length?top.map((x,i)=>`<div class="rankRow"><span class="dot">${i+1}</span><span>${esc(x.display_name||displayName(x.name))}</span><span>${esc(x.masked_phone||maskPhone(x.phone))}</span><span>${Number(x.total_deposited||0)}杯</span></div>`).join(''):'<div style="padding:18px;text-align:center;font-weight:900">目前還沒有寄杯排行</div>'}catch(e){document.getElementById('rankList').innerHTML='<div style="padding:18px;text-align:center;font-weight:900">排行榜暫時無法載入</div>'}}function openLookup(){document.getElementById('lookupModal').classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}async function lookupCup(){const el=document.getElementById('lookupResult');el.innerHTML='<div class="result">查詢中…</div>';try{const d=await post('cupbook-public',{action:'lookup',phone:document.getElementById('lookupPhone').value});if(!d.found){el.innerHTML='<div class="result">查無寄杯資料</div>';return}const c=d.customer;el.innerHTML=`<div class="result"><b>${esc(c.name)}</b><div class="stat"><div>剩餘杯數<b>${c.current_cups}</b></div><div>累積寄杯<b>${c.total_deposited}</b></div><div>已使用<b>${c.total_used}</b></div><div>排行<b>#${c.rank||'-'}</b></div></div></div>`}catch(e){el.innerHTML=`<div class="result">${esc(e.message)}</div>`}}let pendingSearch='',pendingCreate=false,loginOnly=false,signatureDirty=false,searchResults=[];

function validPhoneSearch(q){
  return q.length===3||/^09\d{8}$/.test(q);
}

function quickSearch(){
  const input=document.getElementById('homeSearch');
  const q=input.value.replace(/\D/g,'');
  input.value=q;
  if(!validPhoneSearch(q)){
    input.setCustomValidity('請輸入完整手機號碼或後三碼');
    input.reportValidity();
    return;
  }
  input.setCustomValidity('');
  pendingSearch=q;
  pendingCreate=false;
  loginOnly=false;
  openAdmin();
}

function startCreateCustomer(){
  pendingCreate=true;
  pendingSearch='';
  loginOnly=false;
  openAdmin();
}

function applyPendingAction(){
  if(loginOnly){
    loginOnly=false;
    closeModal('adminModal');
    return;
  }
  if(pendingCreate){
    showCreate();
    return;
  }
  document.getElementById('adminArea').style.display='block';
  const q=pendingSearch;
  pendingSearch='';
  if(q) searchCustomers(q);
}

function openLogin(){
  pendingCreate=false;
  pendingSearch='';
  loginOnly=true;
  if(getAdminPin()){
    updateLoginButton();
    alert('此裝置已登入');
    return;
  }
  openAdmin();
}

function getAdminPin(){
  return localStorage.getItem('cupbook_pin')||sessionStorage.getItem('cupbook_pin')||'';
}

function updateLoginButton(){
  const b=document.getElementById('loginButton');
  if(b) b.textContent=getAdminPin()?'已登入':'登入使用';
}

function openAdmin(){
  document.getElementById('adminTitle').textContent=pendingCreate?'新世界の王者参上!':loginOnly?'登入使用':'快速找寄杯';
  document.getElementById('adminModal').classList.add('show');
  const pin=getAdminPin();
  document.getElementById('pinBox').style.display=pin?'none':'block';
  document.getElementById('adminArea').style.display='none';
  document.getElementById('newCustomerArea').style.display='none';
  document.getElementById('customerResults').innerHTML='';
  document.getElementById('transactionBox').innerHTML='';
  selectedCustomer=null;
  searchResults=[];
  updateLoginButton();
  if(pin) setTimeout(applyPendingAction,0);
}

async function savePin(){
  const p=document.getElementById('adminPin').value.trim();
  if(!p) return;
  const b=document.getElementById('pinBox').querySelector('button');
  const old=b.textContent;
  b.disabled=true;
  b.textContent='驗證中…';
  try{
    await post('cupbook-admin',{action:'search',q:'0900000000'},{'x-admin-pin':p});
    localStorage.setItem('cupbook_pin',p);
    sessionStorage.removeItem('cupbook_pin');
    document.getElementById('pinBox').style.display='none';
    updateLoginButton();
    applyPendingAction();
  }catch(e){
    localStorage.removeItem('cupbook_pin');
    sessionStorage.removeItem('cupbook_pin');
    alert('驗證碼錯誤');
  }finally{
    b.disabled=false;
    b.textContent=old;
  }
}

async function adminPost(body){
  try{
    return await post('cupbook-admin',body,{'x-admin-pin':getAdminPin()});
  }catch(e){
    if(e.status===401||e.status===403){
      localStorage.removeItem('cupbook_pin');
      sessionStorage.removeItem('cupbook_pin');
      updateLoginButton();
    }
    throw e;
  }
}

function customerSummary(c){
  const rank=Number(c.rank)||0;
  return `<div class="customer-profile">
    <div class="customer-identity"><b>${esc(c.name)}</b><span>${esc(c.phone)}</span></div>
    <div class="customer-stats">
      <div>剩餘杯數<b>${Number(c.current_cups||0)}</b></div>
      <div>累積杯數<b>${Number(c.total_deposited||0)}</b></div>
      <div>排名<b>${rank?'#'+rank:'-'}</b></div>
    </div>
  </div>`;
}

async function searchCustomers(q){
  const box=document.getElementById('customerResults');
  const tx=document.getElementById('transactionBox');
  q=String(q||'').replace(/\D/g,'');
  tx.innerHTML='';
  selectedCustomer=null;
  searchResults=[];
  if(!validPhoneSearch(q)){
    box.innerHTML='<div class="result">請輸入完整手機號碼或後三碼</div>';
    return;
  }
  box.innerHTML='<div class="result">搜尋中…</div>';
  try{
    const d=await adminPost({action:'search',q});
    searchResults=Array.isArray(d.customers)?d.customers:[];
    if(!searchResults.length){
      box.innerHTML='<div class="result">查無寄杯客人</div>';
      return;
    }
    if(searchResults.length===1){
      selectCustomerByIndex(0);
      return;
    }
    box.innerHTML=`<div class="result-count">找到 ${searchResults.length} 位後三碼相同的客人，請選擇：</div>`+
      searchResults.map((c,i)=>`<button type="button" class="customer-card customer-select" onclick="selectCustomerByIndex(${i})">${customerSummary(c)}<span class="select-customer">選擇這位客人 ›</span></button>`).join('');
  }catch(e){
    box.innerHTML=`<div class="result">${esc(e.message)}</div>`;
  }
}

function selectCustomerByIndex(index){
  selectedCustomer=searchResults[index];
  if(!selectedCustomer) return;
  document.getElementById('customerResults').innerHTML='';
  renderTransaction();
}

function chooseCups(cups){
  document.getElementById('txCups').value=String(cups);
  document.querySelectorAll('.cup-choice').forEach(b=>b.classList.toggle('selected',Number(b.dataset.cups)===cups));
  updateDeductSubmit();
}

function manualCupInput(){
  const input=document.getElementById('txCups');
  input.value=input.value.replace(/\D/g,'');
  document.querySelectorAll('.cup-choice').forEach(b=>b.classList.remove('selected'));
  updateDeductSubmit();
}

function updateDeductSubmit(){
  const button=document.getElementById('confirmUseButton');
  if(!button||!selectedCustomer) return;
  const cups=Number(document.getElementById('txCups').value);
  const remaining=Number(selectedCustomer.current_cups||0);
  const validCups=Number.isInteger(cups)&&cups>=1&&cups<=remaining;
  const hint=document.getElementById('cupHint');
  if(hint){
    hint.textContent=!cups?'請選擇或輸入杯數':cups>remaining?`杯數不可超過剩餘 ${remaining} 杯`:validCups?`扣除後剩餘 ${remaining-cups} 杯`:'請輸入正確杯數';
    hint.className='cup-hint'+(cups>remaining?' error':'');
  }
  button.disabled=!(validCups&&signatureDirty);
}

function renderTransaction(){
  if(!selectedCustomer) return;
  signatureDirty=false;
  document.getElementById('transactionBox').innerHTML=`${customerSummary(selectedCustomer)}
    <h3 class="deduct-title" style="margin-bottom:10px">新增寄杯</h3>
    <button id="addDepositButton" type="button" class="btn" style="background:#ff4c91" onclick="addDeposit20()">＋ 新增一組寄杯（20杯）</button>

    <div class="cup-buttons">
      ${[1,2,3,4,5].map(n=>`<button type="button" class="cup-choice" data-cups="${n}" onclick="chooseCups(${n})">${n}杯</button>`).join('')}

    <div class="field">
      <label for="txCups">自行輸入</label>
      <input id="txCups" type="text" inputmode="numeric" maxlength="3" placeholder="輸入扣除杯數" oninput="manualCupInput()">
      <div id="cupHint" class="cup-hint">請選擇或輸入杯數</div>

      <label>客人簽名（必填）</label>

async function addDeposit20(){
  if(!selectedCustomer) return;
  if(!confirm('確認已收款，並新增一組寄杯（20杯）？')) return;
  const button=document.getElementById('addDepositButton');

function setupCanvas(){
  const c=document.getElementById('sig');
  if(!c) return;
  const dpr=devicePixelRatio||1;
  c.width=c.clientWidth*dpr;
  c.height=c.clientHeight*dpr;
  const x=c.getContext('2d');
  x.scale(dpr,dpr);
  x.lineWidth=2.5;
  x.lineCap='round';
  x.lineJoin='round';
  let down=false;
  function pt(e){
    const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
    return [t.clientX-r.left,t.clientY-r.top];
  }
  function start(e){
    down=true;
    x.beginPath();
    x.moveTo(...pt(e));
    e.preventDefault();
  }
  function move(e){
    if(!down) return;
    x.lineTo(...pt(e));
    x.stroke();
    if(!signatureDirty){
      signatureDirty=true;
      const hint=document.getElementById('signatureHint');
      if(hint){
        hint.textContent='簽名完成';
        hint.className='signature-hint done';
      }
      updateDeductSubmit();
    }
    e.preventDefault();
  }
  function end(){
    down=false;
  }
  c.onmousedown=start;
  c.onmousemove=move;
  window.onmouseup=end;
  c.ontouchstart=start;
  c.ontouchmove=move;
  c.ontouchend=end;
}

function clearSig(){
  const c=document.getElementById('sig');
  if(!c) return;
  c.getContext('2d').clearRect(0,0,c.width,c.height);
  signatureDirty=false;
  const hint=document.getElementById('signatureHint');
  if(hint){
    hint.textContent='請客人完成簽名';
    hint.className='signature-hint';
  }
  updateDeductSubmit();
}

async function submitTx(){
  if(!selectedCustomer) return;
  const cups=Number(document.getElementById('txCups').value);
  const remaining=Number(selectedCustomer.current_cups||0);
  if(!Number.isInteger(cups)||cups<1) return alert('請選擇或輸入扣除杯數');
  if(cups>remaining) return alert('扣除杯數不可超過剩餘杯數');
  if(!signatureDirty) return alert('請客人先簽名');
  const button=document.getElementById('confirmUseButton');
  button.disabled=true;
  button.textContent='扣除中…';
  try{
    const signature=document.getElementById('sig').toDataURL('image/png');
    const d=await adminPost({action:'transaction',customer_id:selectedCustomer.id,type:'use',cups,note:null,signature});
    const left=Number(d.customer?.current_cups??remaining-cups);
    alert(`完成：已扣除 ${cups} 杯，剩餘 ${left} 杯`);
    selectedCustomer=null;
    searchResults=[];
    closeModal('adminModal');
    loadHome();
  }catch(e){
    alert(e.message);
    button.disabled=false;
    button.textContent='確認扣除';
    updateDeductSubmit();
  }
}let createdCustomerForPurchase=null,createSubmitting=false;function showCreate(){pendingCreate=true;document.getElementById('adminTitle').textContent='新世界の王者参上!';document.getElementById('adminArea').style.display='none';document.getElementById('newCustomerArea').style.display='block';resetNewCustomerForm()}function resetNewCustomerForm(){createdCustomerForPurchase=null;createSubmitting=false;document.getElementById('newName').value='';document.getElementById('newPhone').value='';document.querySelectorAll('input[name="purchaseGroup"]').forEach(x=>x.checked=false);document.getElementById('cashConfirmed').checked=false;const m=document.getElementById('createCustomerMessage');m.textContent='';m.className='form-message';const b=document.getElementById('createCustomerSubmit');b.textContent='完成';b.disabled=true}function updateNewCustomerSubmit(){const name=document.getElementById('newName').value.trim(),phone=document.getElementById('newPhone').value.replace(/\D/g,''),purchase=document.querySelector('input[name="purchaseGroup"]:checked'),cash=document.getElementById('cashConfirmed').checked;document.getElementById('newPhone').value=phone;document.getElementById('createCustomerSubmit').disabled=createSubmitting||!(name&&/^09\d{8}$/.test(phone)&&purchase&&cash)}async function createCustomer(){updateNewCustomerSubmit();const button=document.getElementById('createCustomerSubmit');if(button.disabled)return;const name=document.getElementById('newName').value.trim(),phone=document.getElementById('newPhone').value,purchase=document.querySelector('input[name="purchaseGroup"]:checked'),cups=Number(purchase.value),amount=Number(purchase.dataset.amount),units=cups/20,message=document.getElementById('createCustomerMessage');createSubmitting=true;button.disabled=true;button.textContent='處理中…';message.textContent='正在建立客戶與寄杯資料…';message.className='form-message';try{if(!createdCustomerForPurchase){const created=await adminPost({action:'create',name,phone});createdCustomerForPurchase=created.customer}const deposited=await adminPost({action:'transaction',customer_id:createdCustomerForPurchase.id,type:'deposit',cups,note:'新世界の王者参上!｜'+units+'組｜非常確認收款 $'+amount,signature:null});selectedCustomer=deposited.customer;pendingCreate=false;createdCustomerForPurchase=null;message.textContent='完成：已寄杯 '+cups+' 杯';message.className='form-message success';button.textContent='完成';loadHome();alert('完成：已建立 '+name+'，寄杯 '+cups+' 杯（$'+amount+'）');closeModal('adminModal')}catch(e){message.textContent=e.message;message.className='form-message error';button.textContent='完成'}finally{createSubmitting=false;updateNewCustomerSubmit()}}updateLoginButton();loadHome();</script></body></html>
