name: Fix visual center v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-visual-center-v5.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject true visual centering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<style id="home-card-center-v5">.actions .card.use .txt,.actions .card.lookup .txt{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:58%!important;display:block!important;text-align:center!important;margin:0!important}.actions .card.use .txt h3,.actions .card.lookup .txt h3{font-size:18px!important;line-height:1.25!important;margin:0!important;min-height:0!important;text-align:center!important}.actions .card.use .txt p,.actions .card.lookup .txt p{font-size:13px!important;line-height:1.3!important;margin:6px 0 0!important;text-align:center!important}.quick-card .txt h3{position:absolute!important;left:50%!important;top:20px!important;transform:translateX(-50%)!important;width:52%!important;font-size:18px!important;line-height:1.2!important;min-height:0!important;margin:0!important;text-align:center!important;white-space:nowrap!important}.quick-card .quick-form{margin-top:38px!important}@media(max-width:440px){.actions .card.use .txt,.actions .card.lookup .txt{width:60%!important}.actions .card.use .txt h3,.actions .card.lookup .txt h3{font-size:17px!important}.actions .card.use .txt p,.actions .card.lookup .txt p{font-size:12.5px!important}.quick-card .txt h3{top:18px!important;width:54%!important;font-size:17px!important}.quick-card .quick-form{margin-top:36px!important}}</style>'
          if 'id="home-card-center-v5"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[recovered] True-center home card text"
          git push
