name: Fix history audit workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-history-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/add-history-audit-v2.yml')
          s=p.read_text(encoding='utf-8')
          old="'))).decode('utf-8')"
          new="')).decode('utf-8')"
          if old not in s:
              raise SystemExit('target syntax not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/add-history-audit-v2.yml
          git commit -m "Fix history audit patch syntax"
          git push
