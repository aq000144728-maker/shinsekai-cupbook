name: Add ranking profile settings UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-ranking-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ranking profile UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'ranking-profile-v1' in s:
              raise SystemExit(0)
          payload=base64.b64decode('').decode('utf-8')
          if '</body>' not in s:
              raise SystemExit('missing body close')
          p.write_text(s.replace('</body>',payload+'</body>',1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[recovered] Add ranking nickname and full-name settings"
          git push
