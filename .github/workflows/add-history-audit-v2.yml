name: Add cup history and audit UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-history-audit-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add history and audit UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'cupbook-history-audit-v2' in s:
              raise SystemExit(0)
          payload=zlib.decompress(base64.b64decode(''))).decode('utf-8')
          if '</body>' not in s:
              raise SystemExit('missing body close')
          p.write_text(s.replace('</body>',payload+'</body>',1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[recovered] Add customer history and admin audit UI"
          git push
