name: Nickname only ranking explanation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nickname-only-explanation-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add nickname-only UI override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'nickname-only-explanation-v3' in s:
              raise SystemExit(0)
          patch=base64.b64decode('').decode('utf-8')
          if '</body>' not in s:
              raise SystemExit('missing body close')
          p.write_text(s.replace('</body>',patch+'\n</body>',1),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace full-name checkbox with nickname explanation"
          git push
